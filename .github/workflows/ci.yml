# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Replaces the previous ci.yml (Python 3.11 + 3.12 matrix: Ruff, unittest contract tests, compileall).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both supported versions, as the old matrix did (requires-python >=3.11).
  lake-py311:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: "3.11"
      # The tests need pyarrow + duckdb (the "lake" extra); there is no dev extra.
      install-command: uv pip install -e ".[lake]"
      test-command: python -m unittest discover -s tests -v && python -m compileall -q src

  lake-py312:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: "3.12"
      install-command: uv pip install -e ".[lake]"
      test-command: python -m unittest discover -s tests -v && python -m compileall -q src

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
